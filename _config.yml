  Senior Engineering Manager at Amazon, leading engineering for Books and Kindle's purchase and payments experience worldwide. Fifteen years building distributed systems at the edge of how millions of customers discover, purchase, pay, reward and read books — most recently steering the org through an AI-native engineering transition and exploring agentic commerce.

